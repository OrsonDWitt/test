---
layout: default
---
<article class="post">
<header>
<p class="meta"><a href="/posts/">Journal</a> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
<h1>{{ page.title }}</h1>
</header>
{% if page.image %}<figure class="cover"><img src="{{ page.image }}" alt=""></figure>{% endif %}
<div class="prose">
{{ content }}
</div>
</article>
