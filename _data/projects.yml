# One entry per project. Order here is the order on the homepage and in "Next project".
# To add a project: add an entry, then create _pages/<slug>.md with `layout: project` and `project: <slug>`.
- slug: birdmapp
  url: /birdmapp
  title: BirdMApp
  kind: Data app for Windows
  line: Which birds live where, and when? A map built from a billion sightings.
  bg: "#D4D6D9"
  ink: "#16202B"
  accent: "#D9604F"
  img: /assets/img/birdmapp.jpg
  w: 1000
  h: 1283
  pos: "78% 22%"
  alt: "BirdMApp’s map of Europe, with countries shaded coral by how many bird species they hold."
  facts:
    - {k: Data, v: "1 billion occurrence records, 2011 to 2021, from GBIF"}
    - {k: Coverage, v: "More than 10,000 species, month by month"}
    - {k: Pipeline, v: "R and data.table, up to 30 million rows per month"}
    - {k: Availability, v: "Windows download, source on GitHub"}
  media:
    - {type: video, src: /assets/birdmapp/bird_map.mp4, poster: /assets/img/poster-bird_map.jpg, label: "BirdMApp map view", caption: "See every species you are likely to meet in any region, in any month."}
    - {type: video, src: /assets/birdmapp/bird_distribution.mp4, poster: /assets/img/poster-bird_distribution.jpg, label: "BirdMApp species ranges", caption: "Ranges rebuilt from a billion occurrences, 2011 to 2021. Follow the monthly migrations of more than 10,000 species and compare them with your own observations."}
    - {type: video, src: /assets/birdmapp/bird_charts.mp4, poster: /assets/img/poster-bird_charts.jpg, label: "BirdMApp progress charts", caption: "Track your own progress."}
    - {type: image, src: /assets/img/endemic.jpg, w: 1600, h: 825, alt: "World map showing the number of endemic bird species in each country.", caption: "From the dataset: endemic bird species by country."}
  links:
    - items:
        - {t: "Download for Windows", u: "https://github.com/OrsonDeWitt/BirdMApp/archive/refs/tags/v1.0.1.zip", primary: true}
        - {t: "Source on GitHub", u: "https://github.com/OrsonDeWitt/BirdMApp"}
        - {t: "Read the retrospective", u: "/posts/birdmapp-retrospective/"}

